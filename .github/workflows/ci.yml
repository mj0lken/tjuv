name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only builds and tests.
permissions:
  contents: read

# A new push to a PR replaces its running build; every commit on main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift build
      - run: swift test
      # The release build and .app packaging that scripts/release.sh ships.
      - run: scripts/build-app.sh
